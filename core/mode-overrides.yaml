# Mode Overrides — 边缘场景的模式覆写配置
#
# 本文件为 agent-modes.md 与 persona-router.md §8 的补充配置层。
# 当 manifest 默认模式或意图推断结果不适用于特定边缘场景时，
# 通过本文件覆写。优先级高于 manifest 默认值，低于用户显式指定。
#
# 生效顺序：用户显式 > mode-overrides.yaml > manifest 默认 > 意图推断 > task

version: "1.0"

# ------------------------------------------------------------------
# 1. Profile 级覆写 — 覆写特定 Profile 的默认模式
# ------------------------------------------------------------------
profile_overrides:
  # 示例：强制 coding 在特定仓库中使用 autonomous 模式
  # coding:
  #   repos:
  #     - path: "C:/projects/large-monorepo"
  #       force_mode: autonomous
  #       reason: "大型单体仓库，改动影响面广，需全自主规划与自检"
  #   force_mode: project  # 全局覆写（慎用）

  # 示例：conversation 在深度调研场景升级为 project
  # conversation:
  #   force_mode: project
  #   conditions:
  #     - task_contains_keywords: ["深度调研", "综合分析", "多源对比"]

# ------------------------------------------------------------------
# 2. 条件覆写 — 基于任务特征的动态覆写
# ------------------------------------------------------------------
condition_overrides:
  # 示例：任务涉及 ≥5 个子目标时自动升级为 autonomous
  # - name: "complex-task-auto"
  #   when:
  #     subgoal_count: 5
  #     comparison: ">="
  #   then:
  #     force_mode: autonomous
  #     reason: "任务子目标过多，全自主模式避免频繁等待用户确认"

  # 示例：任务涉及 ≥3 个文件时升级为 project
  # - name: "multi-file-upgrade"
  #   when:
  #     file_count: 3
  #     comparison: ">="
  #   then:
  #     force_mode: project

  # 示例：任务含"试试"/"探索"/"实验"等试探性词时降级为 task
  # - name: "exploratory-downgrade"
  #   when:
  #     task_contains_keywords: ["试试", "试一下", "看看", "探索", "实验"]
  #   then:
  #     force_mode: task
  #     reason: "试探性请求，使用 task 模式避免过度执行"

# ------------------------------------------------------------------
# 3. 时间窗口覆写 — 基于时段的策略调整
# ------------------------------------------------------------------
time_window_overrides:
  # 示例：工作时间（9:00-18:00）默认 project，非工作时间降为 task
  # - name: "work-hours"
  #   window: "09:00-18:00"
  #   timezone: "Asia/Shanghai"
  #   then:
  #     default_mode: project
  #   else:
  #     default_mode: task
  #     reason: "非工作时间，减少干扰"

# ------------------------------------------------------------------
# 4. 产物类型覆写 — 基于输出类型的模式选择
# ------------------------------------------------------------------
output_type_overrides:
  # 示例：仅信息查询类的输出，即使 Profile 默认 project 也降为 task
  # - output_types: ["info_query", "fact_check", "translation"]
  #   force_mode: task

  # 示例：产物为文档/报告/代码包时至少用 project
  # - output_types: ["document", "report", "code_package"]
  #   min_mode: project

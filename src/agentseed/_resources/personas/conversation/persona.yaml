# conversation Profile 装配清单
# 来源仓库: badhope/universal
# 适用场景: 通用问答、调研、方案对比、信息检索

profile:
  id: conversation
  name: 通用对话规则
  source_repo: badhope/universal
  mutually_exclusive_with:
    - novel
    - interactive-novel
    - agent-builder
  agent_mode:
    default: task
    allowed:
      - task
      - project

includes:
  core:
    - core/governance.md
    - core/interaction.md
    - core/persona-router.md
    - core/language-mediation.md
    - core/attention-budget.md
    - core/agent-modes.md
  profile:
    - personas/conversation/AGENTS.md
    - personas/conversation/prompts/system-prompt.md
  skills:
    - personas/conversation/skills/truth-protocol.md
    - personas/conversation/skills/deep-search.md
    - personas/conversation/skills/anti-dumb-ai.md
    - personas/conversation/skills/clarification-protocol.md
    - personas/conversation/skills/conversation-quality.md
    - personas/conversation/skills/source-credibility.md
    - personas/conversation/skills/reasoning-depth.md
    - personas/conversation/skills/solution-framework.md
    - personas/conversation/skills/multi-turn-coherence.md
    - personas/conversation/skills/context-management.md
    - personas/conversation/skills/slash-commands.md
    - personas/conversation/skills/path-scoped-rules.md
    - personas/conversation/skills/security-checklist.md
    - personas/conversation/skills/tool-skill-mcp.md
    - personas/conversation/skills/evolution-policy.md

enables_capabilities:
  - research
  - dar

forbids_capabilities:
  - engineering
  - creative
  - game-engine

activation_anchors: []

intent_keywords:
  - 查询
  - 对比
  - 分析
  - 调研
  - 总结
  - 解释

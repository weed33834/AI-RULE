    - personas/agent-builder/templates/data-analyst/
    - personas/agent-builder/templates/general-assistant/
    - personas/agent-builder/templates/research-assistant/
    - personas/agent-builder/templates/workflow-automator/

enables_capabilities:
  - research
  - agent-governance
  - engineering
  - testing
  - dar
  - orchestration

forbids_capabilities:

activation_anchors:
  - config.yaml
  - tools.json
  - test-cases.md


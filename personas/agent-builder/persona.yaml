# agent-builder Profile 装配清单
# 来源仓库: badhope/AgentCreater
# 适用场景: 设计/评估/部署智能体，产出 config、工具定义、测试用例

profile:
  id: agent-builder
  name: 智能体构建规则
  source_repo: badhope/AgentCreater
  mutually_exclusive_with:
    - conversation
    - novel
  agent_mode:
    default: project
    allowed:
      - task
      - project
      - autonomous


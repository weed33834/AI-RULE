    - personas/agent-builder/prompts/tool-orchestrator.md
    - personas/agent-builder/prompts/memory-architect.md
    - personas/agent-builder/prompts/evaluator.md
    - personas/agent-builder/prompts/safety-guard.md
    - personas/agent-builder/prompts/skill-injector.md
  skills:

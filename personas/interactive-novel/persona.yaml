# interactive-novel Profile 装配清单
# 来源仓库: badhope/interactive-novel
# 适用场景: 互动小说游戏、分支叙事、状态机驱动

profile:
  id: interactive-novel
  name: 互动小说游戏规则
  source_repo: badhope/interactive-novel
  mutually_exclusive_with:
    - coding
    - conversation
    - novel
    - agent-builder
    - paper
  agent_mode:
    default: task
    allowed:
      - task
      - project

includes:
  core:
    - core/governance.md
    - core/interaction.md
    - core/persona-router.md
    - core/language-mediation.md
    - core/attention-budget.md
    - core/agent-modes.md
  profile:
    - personas/interactive-novel/AGENTS.md
    - personas/interactive-novel/prompts/system-prompt.md
    - personas/interactive-novel/prompts/game-master.md
    - personas/interactive-novel/prompts/narrator-engine.md
    - personas/interactive-novel/prompts/npc-engine.md
  skills:
    - personas/interactive-novel/skills/anti-dumb-ai.md
    - personas/interactive-novel/skills/branching-narrative.md
    - personas/interactive-novel/skills/combat-system.md
    - personas/interactive-novel/skills/context-management.md
    - personas/interactive-novel/skills/dialogue-system.md
    - personas/interactive-novel/skills/difficulty-engine.md
    - personas/interactive-novel/skills/ending-system.md
    - personas/interactive-novel/skills/evolution-policy.md
    - personas/interactive-novel/skills/game-evaluation.md
    - personas/interactive-novel/skills/game-state-machine.md
    - personas/interactive-novel/skills/genre-system.md
    - personas/interactive-novel/skills/inventory-system.md
    - personas/interactive-novel/skills/memory-system.md
    - personas/interactive-novel/skills/narrative-coherence.md
    - personas/interactive-novel/skills/npc-ai.md
    - personas/interactive-novel/skills/onboarding-system.md
    - personas/interactive-novel/skills/path-scoped-rules.md
    - personas/interactive-novel/skills/player-agency.md
    - personas/interactive-novel/skills/replay-system.md
    - personas/interactive-novel/skills/security-checklist.md
    - personas/interactive-novel/skills/session-management.md
    - personas/interactive-novel/skills/state-management.md
    - personas/interactive-novel/skills/tool-skill-mcp.md
    - personas/interactive-novel/skills/world-simulation.md

enables_capabilities:
  - creative
  - research
  - state-machine
  - npc-simulation
  - adaptive-difficulty
  - dar

forbids_capabilities:
  - engineering
  - novel-chapter-deliverable-mode

activation_anchors:
  - .game-state/
  - game-state-machine.md
  - save-slot-*.json

intent_keywords:
  - 开始一局
  - 分支
  - 存档
  - NPC
  - 回合
  - 状态
  - 选项

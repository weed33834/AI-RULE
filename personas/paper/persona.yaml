# paper Profile Assembly Manifest
# Source repo: badhope/paper
# Scenario: Academic paper writing, literature review, manuscript drafting, peer-review simulation

profile:
  id: paper
  name: Academic Paper Writing Rules
  source_repo: badhope/paper
  mutually_exclusive_with:
    - novel
    - interactive-novel
  agent_mode:
    default: project
    allowed:
      - task
      - project
      - autonomous

includes:
  core:
    - core/governance.md
    - core/interaction.md
    - core/persona-router.md
    - core/language-mediation.md
    - core/attention-budget.md
    - core/agent-modes.md
  profile:
    - personas/paper/AGENTS.md
    - personas/paper/prompts/system-prompt.md
    - personas/paper/prompts/literature-reviewer.md
    - personas/paper/prompts/writer-subagent.md
    - personas/paper/prompts/reviewer-subagent.md
  skills:
    - personas/paper/skills/academic-integrity.md
    - personas/paper/skills/citation-protocol.md
    - personas/paper/skills/literature-synthesis.md
    - personas/paper/skills/paper-structure.md
    - personas/paper/skills/research-question.md
    - personas/paper/skills/methodology-design.md
    - personas/paper/skills/data-presentation.md
    - personas/paper/skills/academic-style.md
    - personas/paper/skills/peer-review-simulation.md
    - personas/paper/skills/revision-response.md
    - personas/paper/skills/context-management.md
    - personas/paper/skills/evolution-policy.md
    - personas/paper/skills/path-scoped-rules.md
    - personas/paper/skills/security-checklist.md
    - personas/paper/skills/tool-skill-mcp.md
    - personas/paper/skills/git-sop.md

enables_capabilities:
  - research
  - dar

forbids_capabilities:
  - game-engine
  - state-machine
  - npc-simulation
  - novel-chapter-deliverable-mode

activation_anchors:
  - .ai-memory/paper-blueprint.md
  - manuscript/
  - references.bib

intent_keywords:
  - paper
  - literature review
  - abstract
  - introduction
  - methodology
  - results
  - discussion
  - citation
  - submit
  - review
  - 论文
  - 文献综述
  - 摘要
  - 引言
  - 方法
  - 结果
  - 讨论
  - 引用
  - 投稿
  - 审稿
